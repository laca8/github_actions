name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:

  # =========================
  # Backend
  # =========================
  backend-test:
    name: Backend Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-github-actions-demo/package-lock.json

      - name: Install backend dependencies
        working-directory: node-github-actions-demo
        run: npm ci

      - name: Run backend tests
        working-directory: node-github-actions-demo
        run: npm test


  # =========================
  # Frontend
  # =========================
  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: my-app
        run: npm ci

      - name: Build frontend
        working-directory: my-app
        run: npm run build


  # =========================
  # Docker Build
  # =========================
  docker-build:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        working-directory: node-github-actions-demo
        run: docker build -t backend:latest .

      - name: Build frontend Docker image
        working-directory: my-app
        run: docker build -t frontend:latest .