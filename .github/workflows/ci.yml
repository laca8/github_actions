name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev
      
  workflow_dispatch:
jobs:

  # =========================
  # Backend
  # =========================
  backend-test:
    name: Backend Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-github-actions-demo/package-lock.json

      - name: Install backend dependencies
        working-directory: node-github-actions-demo
        run: npm ci

      - name: Run backend tests
        working-directory: node-github-actions-demo
        run: npm test


  # =========================
  # Frontend
  # =========================
  frontend-build:
    name: Frontend Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: my-app
        run: npm ci

      - name: Build frontend
        working-directory: my-app
        run: npm run build


  # =========================
  # Docker Build
  # =========================
  docker-build:
    name: Docker Build & Push

    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        working-directory: node-github-actions-demo
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-backend:latest \
            .

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-backend:latest

      - name: Build frontend image
        working-directory: my-app
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-frontend:latest \
            .

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/github-actions-frontend:latest